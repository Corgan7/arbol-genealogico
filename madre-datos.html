function fmt(s){
  if(!s) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
  if(m) return `${+m[3]} ${MES[+m[2]-1]} ${m[1]}`;
  return s;
}
function anio(s){ if(!s) return null; const m = /(\d{4})/.exec(s); return m ? +m[1] : null; }
function vida(p){
  if(!p.nac && !p.fall) return '';
  if(p.nac && p.fall) return `${fmt(p.nac)} — ${fmt(p.fall)}`;
  return p.nac ? fmt(p.nac) : `† ${fmt(p.fall)}`;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const $ = s => document.querySelector(s);

function hermanos(id){
  const p = P[id].pa; if(!p || !p.length) return [];
  const set = new Set();
  p.forEach(pid => (P[pid]?.h || []).forEach(h => { if(h !== id) set.add(h); }));
  return [...set];
}
function clase(p){
  if(p.hueco) return 'hueco';
  if(p.viva) return 'viva';
  if(p.r === 'pol') return 'pol';
  return p.d ? '' : 'col';
}

function riqueza(p){
  if(p.hueco) return 0;
  let n = 0;
  if(p.nac) n += 2; if(p.fall) n += 1; if(p.o) n += 1;
  n += p.f.filter(f => f[1] === 'doc').length * 1.5;
  n += p.f.filter(f => f[1] === 'mem').length * .6;
  return Math.min(1, n / 8);
}


/* ── paquete de precarga: todo lo que sabemos, en un solo parámetro ── */
function paquete(p, PP, origen, claveRama){
  const lim = (s,n) => s ? String(s).slice(0,n) : '';
  const nom = x => PP[x] && !PP[x].hueco ? PP[x].n : '';
  const listaHijos = (PP[p.id] && PP[p.id].h ? PP[p.id].h : (p.h||[])).map(nom).filter(Boolean);
  const hermanos = [];
  (p.pa||[]).forEach(a => (PP[a] && PP[a].h ? PP[a].h : []).forEach(x => {
    if (x !== p.id && nom(x)) hermanos.push(nom(x));
  }));
  const d = {
    id: p.id, o: origen, k: claveRama,
    n:  p.hueco ? '' : p.n.replace(/\s*«[^»]*»\s*/g,' ').replace(/^\[nombre\]\s*/,'').replace(/\s+/g,' ').trim(),
    ap: (p.n.match(/«([^»]*)»/) || [])[1] || '',
    v:  p.viva ? '1' : '0',
    nf: lim(p.nac,40), df: lim(p.fall,40),
    nl: p.nacLugar && L[p.nacLugar] ? L[p.nacLugar].n : '',
    of: lim(p.o,90),
    pa: (p.pa||[]).map(nom).filter(Boolean)[0] || '',
    ma: (p.pa||[]).map(nom).filter(Boolean)[1] || '',
    co: (p.cy||[]).map(nom).filter(Boolean).join(', ').slice(0,180),
    he: [...new Set(hermanos)].join('\n').slice(0,300),
    hi: listaHijos.join('\n').slice(0,300)
  };
  Object.keys(d).forEach(k => { if (!d[k]) delete d[k]; });
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(d))))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return FORMULARIO + '?d=' + b64;
}

function enlaceFicha(p, origen){ return paquete(p, P, origen, CLAVE_RAMA[p.r] || 'FAMILIA26'); }

function llamada(p){
  if(p.viva) return `<div class="llamada viva">
    <h4>${esc(p.n.split(' ')[0])} vive</h4>
    <p>Las fichas de personas vivas solo las puede completar quien tenga
    <b>clave de confianza</b>. Si la tienes, adelante. Si no, pásale el enlace a ella misma.</p>
    <div class="pide">${['Cómo la llaman en casa','A qué se dedica','Dónde vive','Sus hijos','Anécdotas suyas'].map(x=>`<span>${x}</span>`).join('')}</div>
    <a href="${enlaceFicha(p,'datos')}" target="_blank" rel="noopener">Completar su ficha</a>
    <div class="clave">Hace falta una clave que empiece por NUCLEO-</div>
   </div>`;

  const faltan = p.f.filter(f => f[1] === 'falta');
  const pobre = riqueza(p) < .45 || faltan.length >= 2;
  const nom = p.hueco ? 'esta persona' : esc(p.n.split(' ')[0]);
  const sinNombre = p.hueco || /^\[nombre\]|sin nombre|sin datos/i.test(p.n);

  /* lo que pedimos: primero lo que falta, después lo humano */
  const pide = [];
  if(sinNombre) pide.push('Su nombre y sus dos apellidos');
  if(!p.nac) pide.push('Cuándo y dónde nació');
  if(!p.fall) pide.push('Cuándo y dónde falleció');
  if(!p.o) pide.push('A qué se dedicaba');
  pide.push('Cómo la llamaban en casa','Cómo era de carácter','Anécdotas o dichos suyos',
            'Aficiones, qué le gustaba hacer','Dónde vivió, en qué calles',
            'Fotos, cartas o papeles suyos');

  const titulo = sinNombre
    ? 'De esta persona solo sabemos que existió'
    : (pobre ? `De ${nom} sabemos muy poco` : `¿Sabes algo más de ${nom}?`);
  const texto = sinNombre
    ? 'Sabemos que estuvo ahí porque sin ella no estaría esta familia. No sabemos ni cómo se llamaba. ¿Te suena algo, aunque sea a medias?'
    : (pobre
      ? 'Alguien de la familia se acuerda de esto. A lo mejor eres tú. No hace falta que lo sepas todo: con un dato basta.'
      : 'Aquí están las fechas y los papeles, pero falta lo que no sale en ningún archivo: cómo era, qué contaba, a qué olía su casa. Eso solo lo sabe quien la conoció.');

  return `<div class="llamada${pobre ? '' : ' suave'}">
    <h4>${titulo}</h4>
    <p>${texto}</p>
    <div class="pide">${pide.slice(0,7).map(x => `<span>${esc(x)}</span>`).join('')}</div>
    <a href="${enlaceFicha(p,'datos')}" target="_blank" rel="noopener">Añadir datos de ${sinNombre ? 'esta persona' : nom}</a>
    <div class="clave">Se abre con lo que ya sabemos puesto · clave ${CLAVE_RAMA[p.r] || 'FAMILIA26'}</div>
   </div>`;
}

    <div class="ap">Barrios · Porriño · Vizuete · Esquivel · Tobaja · Balsera · Sánchez · Campos — ${porRama.pat||0} personas</div>
    <p>Del Valle del Guadiato a Puertollano. Panaderos, harineros, jornaleros, un mancebo de farmacia y un ferroviario. Es la rama con más profundidad y con el expediente abierto.</p>
    <div class="fila">${gr('pat',4).concat(gr('pat',5), gr('pat',6)).map(x => fichaHTML(x.id)).join('')}</div></div>

   <div class="rama-caja"><h3>Rama materna</h3>
    <div class="ap">Carrasco · Díaz · Varillas · González · Muñoz · Fernández · Domínguez — ${porRama.mat||0} personas</div>
    <p>De Berrocal de Salvatierra a los Montes de Ciudad Real en 1920. Cuatro hermanos que compran El Brezoso y levantan sus casas alrededor de la misma plaza de El Robledo: un molino, una tienda de telas con banco, un cine.</p>
    <div class="fila">${gr('mat',4).concat(gr('mat',5)).map(x => fichaHTML(x.id)).join('')}</div></div>

   <div class="rama-caja"><h3>Los cuatro hermanos Carrasco Varillas</h3>
    <div class="ap">El Robledo · Alcoba de los Montes · Ciudad Real</div>
    <p>Toda la rama materna colateral cuelga de aquí.</p>
    <div class="fila">${['fcv','sixto_cv','genaro_cv','justo_cv'].filter(x=>P[x]).map(fichaHTML).join('')}</div></div>

   <div style="border-top:1px solid var(--linea);margin:30px 0 22px;padding-top:18px">
     <div class="fila-tit">Familias que entran por matrimonio · ${porRama.pol||0} personas</div>
     <p style="font-size:14px;color:#8CA396;margin:-4px 0 16px;max-width:60ch">
      No son tronco del árbol, pero sin ellas la historia se queda coja: cada una trae otro pueblo, otro oficio y otra memoria.</p>
   </div>

   <div class="rama-caja"><h3>Alberca – Calonge</h3>
    <div class="ap">Alberca · Boluda · Bataller · Calonge · Muñoz-Quirós · Leal</div>
    <p>La familia de Ana María Alberca Calonge, mujer de Carlos Carrasco Muñoz. De Campo de Criptana, Alcázar de San Juan y Manzanares. La rama política mejor documentada: casi sesenta personas en una sola conversación.</p>
    <div class="fila">${['antonio_ab','concepcion_b','abuelo_calonge','custodia_m','vicente_ab','dolores_c','ana_ac'].filter(x=>P[x]).map(fichaHTML).join('')}</div></div>

   <div class="rama-caja"><h3>Las demás</h3>
    <div class="ap">Ruiz · Palasó · Sicilia · Medina · Ormeño · Martín · García Garrido · Pavón · Rojas · Alcázar · Núñez</div>
    <p>Cónyuges de la familia y lo que sabemos de sus casas de origen. Cada uno es la puerta a otro árbol entero.</p>
    <div class="fila">${Object.values(P).filter(p=>p.r==='pol'&&!p.hueco&&p.g<=3&&!['antonio_ab','concepcion_b','abuelo_calonge','custodia_m','vicente_ab','dolores_c','ana_ac'].includes(p.id)).map(p=>fichaHTML(p.id)).join('')}</div></div>
   ` + leyenda();
}

function pintarFaltan(){
  const grupos = [
   ['Casillas vacías hacia arriba', 'Cada una se abre con una sola partida',
    Object.values(P).filter(x => x.hueco).sort((a,b) => a.g - b.g)
     .map(x => ({t:x.n, s:x.ap !== '—' ? `Su primer apellido fue ${x.ap}. Falta el nombre de pila.` : 'No se conoce ni nombre ni apellido.', id:x.id}))],
   ['Testigos vivos', 'La única fuente con fecha de caducidad',
    ['mbv','fcm','enc_cm','car_cm','mc_cm','paco_cm'].filter(x => P[x])
     .map(x => ({t:P[x].n, s:'Grabar la conversación antes que cualquier otra cosa.', id:x}))],
   ['Fechas que faltan', 'Nacimiento o defunción sin registrar',
    Object.values(P).filter(x => !x.hueco && !x.nac && !x.fall && x.g >= 2 && x.g <= 4)
     .map(x => ({t:x.n, s:'Sin fecha de nacimiento ni de defunción.', id:x.id}))],
   ['Nombres sueltos por atar', 'Personas mencionadas sin apellido o sin ficha propia',
    Object.values(P).flatMap(x => x.f.filter(f => f[1] === 'falta' && /[Nn]ombres?|[Aa]pellidos?|[Ss]u esposa|[Ss]u marido|[Ss]us padres/.test(f[0]))
     .map(f => ({t:f[0], s:x.n, id:x.id})))],
   ['Hipótesis por confirmar o descartar', 'Nada de esto puede darse por bueno',
    Object.values(P).flatMap(x => x.f.filter(f => f[1] === 'hip' && !x.hueco).map(f => ({t:f[0], s:x.n, id:x.id})))],
   ['Ramas colaterales sin cerrar', 'Matrimonios y descendencia sin registrar',
    Object.values(P).filter(x => !x.d && !x.hueco && x.f.some(f => f[1] === 'falta' && /descendencia/i.test(f[0])))
     .map(x => ({t:x.n, s:'Falta matrimonio o descendencia.', id:x.id}))]
  ];
  let n = 0;
  $('#v-faltan').innerHTML = `
   <div class="llamada" style="margin:0 0 26px">
    <h4>Esta lista es el trabajo que queda</h4>
    <p>Cada línea de aquí abajo es algo que la familia supo alguna vez y se ha ido perdiendo.
    No hace falta ser genealogista: basta con recordar un nombre, una fecha aproximada, un oficio
    o el mote con el que se conocía a alguien en el pueblo.</p>
    <a href="${FORMULARIO}" target="_blank" rel="noopener">Rellenar una ficha</a>
    <div class="clave">Una ficha por persona · puedes rellenar tantas como quieras</div>
   </div>` + grupos.map(([tit,sub,items]) => items.length ? `
   <div class="hueco-grupo"><h3>${esc(tit)}</h3><div class="n">${esc(sub)} · ${items.length}</div>
   ${items.map(i => { n++; return `<div class="preg"><span class="idx">${String(n).padStart(3,'0')}</span>
    <span class="cu"><button data-ir="${i.id}">${esc(i.t)}</button><small>${esc(i.s)}</small></span></div>`; }).join('')}
   </div>` : '').join('') +
   `<div class="aviso">Dime el número y el dato — «037: se llamaba Sebastián» — y lo incorporo. Para corregir, igual: número y corrección.</div>`;
}

function pintarCrono(){
  const ev = [...EV_MAN];
  Object.values(P).forEach(p => {
    if(p.hueco) return;
    if(p.nac && anio(p.nac)) ev.push({f:fmt(p.nac), o:anio(p.nac) + 0.01, t:'Nace ' + p.n, c:'mem', p:p.id});
    if(p.fall && anio(p.fall)) ev.push({f:fmt(p.fall), o:anio(p.fall) + 0.02, t:'Fallece ' + p.n, c:'mem', p:p.id, fin:1});
  });
  $('#v-crono').innerHTML = `<div class="crono">${ev.sort((a,b) => a.o - b.o).map(e => `
   <div class="ev ${e.hito ? 'hito' : ''} ${e.fin ? 'fin' : ''}">
    <div class="f">${esc(e.f)}</div><div class="t">${esc(e.t)}</div>
    ${e.l ? `<div class="l">${esc(L[e.l].n)}</div>` : ''}${e.d ? `<div class="l">${esc(e.d)}</div>` : ''}
    <span class="marca m-${e.c}">${C[e.c].s}</span>
    ${e.p ? ` <button class="marca m-mem" data-ir="${e.p}" style="cursor:pointer;background:none">Ver ficha →</button>` : ''}
   </div>`).join('')}</div>`;
}

function pintarLugares(){
  $('#v-lugares').innerHTML = Object.keys(LUG_PERS).map(k => `<div class="lugar">
   <div class="prov">${esc(L[k].p)}</div><h3>${esc(L[k].n)}</h3><p>${esc(L[k].d)}</p>
   <ul>${LUG_PERS[k].filter(([pid]) => P[pid]).map(([pid,t,c]) => `<li>
    <span class="marca m-${c}">${C[c].m}</span>
    <span><button class="pers" data-ir="${pid}">${esc(P[pid].n)}</button> — ${esc(t)}</span></li>`).join('')}</ul>
   </div>`).join('');
}

function verVista(v){
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.v === v));
  ['arbol','ramas','faltan','crono','lugares'].forEach(x => { $('#v-'+x).hidden = (x !== v); });
}
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => verVista(b.dataset.v));

const q = $('#q'), res = $('#res');
q.addEventListener('input', () => {
  const t = q.value.trim().toLowerCase();
  if(t.length < 2){ res.classList.remove('on'); return; }
  const hits = Object.values(P).filter(p => p.n.toLowerCase().includes(t)).slice(0, 16);
  res.innerHTML = hits.length
   ? hits.map(p => `<button data-ir="${p.id}">${esc(p.n)} <span class="g">${esc(GEN[p.g]||'')}${p.hueco ? ' · casilla vacía' : (p.d ? ' · directo' : '')}</span></button>`).join('')
   : `<button disabled style="color:#6E8378">Sin resultados</button>`;
  res.classList.add('on');
});
q.addEventListener('blur', () => setTimeout(() => res.classList.remove('on'), 180));
res.addEventListener('click', () => { q.value = ''; res.classList.remove('on'); });

const nP = Object.values(P).filter(p => !p.hueco).length;
const nH = Object.values(P).filter(p => p.hueco).length;
$('#cuenta').textContent = `${nP} personas · ${nH} casillas vacías · 8 generaciones`;
pintarArbol(); pintarRamas(); pintarFaltan(); pintarCrono(); pintarLugares();
</script>
</body>
</html>
