<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mapa de la familia</title>
<style>
:root{
  --papel:#DCDFD8; --papel-2:#D2D6CE; --tinta:#1C1A17; --tinta-2:#4A463E;
  --sello:#5B4B8A; --sangre:#8C2F1E; --agua:#AFBAB4; --lapiz:#7C7668;
  --linea:rgba(28,26,23,.16);
  --serif:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--papel);color:var(--tinta);
  font-family:var(--serif);-webkit-font-smoothing:antialiased}

/* ── portada ─────────────────────────────────── */
#puerta{position:fixed;inset:0;z-index:100;background:var(--papel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;
  transition:opacity .5s}
#puerta.ido{opacity:0;pointer-events:none}
.ojo{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--lapiz);margin-bottom:22px}
#puerta h1{font-size:clamp(28px,7vw,44px);font-weight:400;margin:0 0 6px;letter-spacing:-.01em;
  text-align:center;line-height:1.1}
#puerta .sub{font-size:14px;color:var(--tinta-2);margin:0 0 34px;text-align:center;font-style:italic}
#clave{font-family:var(--mono);font-size:15px;letter-spacing:.18em;text-align:center;
  padding:13px 16px;width:min(280px,80vw);background:transparent;color:var(--tinta);
  border:0;border-bottom:1.5px solid var(--tinta);outline:none;text-transform:uppercase}
#clave:focus{border-color:var(--sello)}
#entrar{margin-top:22px;font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;padding:11px 26px;background:var(--tinta);color:var(--papel);
  border:0;cursor:pointer}
#entrar:hover{background:var(--sello)}
#fallo{margin-top:16px;font-size:13px;color:var(--sangre);min-height:20px;font-style:italic}

/* ── estructura ──────────────────────────────── */
#todo{display:none;height:100%;flex-direction:column}
#todo.va{display:flex}
header{padding:14px 20px 10px;border-bottom:1px solid var(--linea);
  display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:400;margin:0;letter-spacing:.01em}
header .cuenta{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--lapiz);
  text-transform:uppercase}
#vista{margin-left:auto;display:flex;gap:2px;flex-wrap:wrap}
#vista button{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 12px;background:transparent;border:1px solid var(--linea);color:var(--tinta-2);cursor:pointer}
#vista button.on{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}

#lienzo{flex:1;position:relative;overflow:hidden;touch-action:none}
svg{width:100%;height:100%;display:block}

/* ── barra del tiempo ────────────────────────── */
#tiempo{border-top:1px solid var(--linea);padding:12px 20px 16px;background:var(--papel)}
.regla{display:flex;align-items:baseline;gap:14px;margin-bottom:8px}
#anyo{font-family:var(--mono);font-size:27px;letter-spacing:.02em;font-variant-numeric:tabular-nums;
  min-width:4.2ch}
#queanyo{font-size:13px;color:var(--tinta-2);font-style:italic;flex:1;line-height:1.35}
#barra{width:100%;-webkit-appearance:none;appearance:none;height:22px;background:transparent;cursor:pointer}
#barra::-webkit-slider-runnable-track{height:1.5px;background:var(--tinta)}
#barra::-moz-range-track{height:1.5px;background:var(--tinta)}
#barra::-webkit-slider-thumb{-webkit-appearance:none;width:3px;height:22px;background:var(--sello);
  margin-top:-10px;border-radius:0}
#barra::-moz-range-thumb{width:3px;height:22px;background:var(--sello);border:0;border-radius:0}
#barra:focus-visible{outline:2px solid var(--sello);outline-offset:4px}
.decadas{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;
  color:var(--lapiz);letter-spacing:.1em;margin-top:2px}
.mandos{display:flex;gap:8px;align-items:center;margin-top:10px}
.mandos button{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:7px 14px;background:transparent;border:1px solid var(--linea);color:var(--tinta-2);cursor:pointer}
.mandos button:hover{border-color:var(--tinta);color:var(--tinta)}
.leyenda{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:9px;
  color:var(--lapiz);letter-spacing:.06em;align-items:center;flex-wrap:wrap}
.leyenda i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;
  vertical-align:-1px}

/* ── panel ───────────────────────────────────── */
#panel{position:absolute;top:0;right:0;bottom:0;width:min(370px,88vw);background:var(--papel);
  border-left:1px solid var(--tinta);transform:translateX(101%);transition:transform .34s cubic-bezier(.3,.7,.3,1);
  overflow-y:auto;padding:22px 22px 40px;z-index:20}
#panel.abierto{transform:none}
#cerrar{position:absolute;top:14px;right:16px;background:transparent;border:0;font-size:22px;
  color:var(--tinta-2);cursor:pointer;line-height:1;padding:4px 8px}
#panel h2{font-size:22px;font-weight:400;margin:6px 0 2px;letter-spacing:-.01em;padding-right:36px}
#panel .prov{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--sello);margin-bottom:14px}
#panel .desc{font-size:14px;line-height:1.55;color:var(--tinta-2);margin-bottom:20px}
.rotulo{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--lapiz);border-bottom:1px solid var(--linea);padding-bottom:5px;margin:22px 0 10px}
.dir{margin-bottom:14px;padding-left:12px;border-left:2px solid var(--sello)}
.dir b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.dir .cuando{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.13em;
  color:var(--lapiz);text-transform:uppercase;margin-bottom:5px}
.dir p{margin:0 0 5px;font-size:13px;line-height:1.5;color:var(--tinta-2)}
.dir a{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--sello);text-decoration:none;border-bottom:1px solid currentColor}
.dir a:hover{color:var(--tinta)}
.dir a.segundo{margin-left:12px;opacity:.6}
.quien{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--linea)}
.quien .f{font-family:var(--mono);font-size:10px;color:var(--lapiz);min-width:9ch;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.quien .nom{font-size:14px;line-height:1.35;flex:1}
.quien .nom small{display:block;font-size:11.5px;color:var(--lapiz);font-style:italic;margin-top:1px}
.quien.directo .nom{font-weight:600}
.quien.sinfecha .f{color:var(--lapiz);opacity:.65}
.quien[data-sigo]{cursor:pointer}
.quien[data-sigo]:hover{background:rgba(91,75,138,.07);margin:0 -8px;padding-left:8px;padding-right:8px}
.quien[data-sigo]:focus-visible{outline:2px solid var(--sello);outline-offset:2px}
.volver{width:100%;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:11px;background:var(--tinta);color:var(--papel);border:0;cursor:pointer;margin-top:6px}
.volver:hover{background:var(--sangre)}
.pista{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--lapiz);
  text-transform:uppercase;margin-top:14px;padding-top:10px;border-top:1px solid var(--linea)}
@media(max-width:640px){
  header{padding:11px 15px 8px} header h1{font-size:15px}
  #tiempo{padding:10px 15px 14px} #anyo{font-size:23px}
  .leyenda{width:100%;margin:8px 0 0}
  #panel{width:100%;border-left:0;border-top:1px solid var(--tinta)}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="puerta">
  <div class="ojo">Archivo familiar · privado</div>
  <h1>Por dónde anduvieron</h1>
  <p class="sub">Dos siglos de familia sobre el mapa</p>
  <input id="clave" type="password" placeholder="CLAVE" autocomplete="off"
         autocapitalize="characters" spellcheck="false" inputmode="text">
  <button id="entrar">Abrir el mapa</button>
  <div id="fallo"></div>
</div>

<div id="todo">
  <header>
    <h1>Por dónde anduvieron</h1>
    <span class="cuenta" id="cuenta"></span>
    <div id="vista">

    </div>
  </header>

  <div id="lienzo">
    <svg id="svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Mapa de los lugares de la familia"></svg>
    <aside id="panel" aria-live="polite">
      <button id="cerrar" aria-label="Cerrar">×</button>
      <div id="contenido"></div>
    </aside>
  </div>

  <div id="tiempo">
    <div class="regla">
      <span id="anyo">1780</span>
      <span id="queanyo"></span>
    </div>
    <input id="barra" type="range" min="1780" max="2026" value="1780" step="1"
           aria-label="Año">
    <div class="decadas"><span>1780</span><span>1840</span><span>1900</span><span>1960</span><span>2026</span></div>
    <div class="mandos">
      <button id="play">▶ Recorrer</button>
      <button id="todos">Ver todo</button>
      <span class="leyenda">
        <span><i style="background:#1C1A17"></i>con documento</span>
        <span><i style="background:#5B4B8A"></i>sin confirmar</span>
        <span><i style="background:#7C7668;opacity:.5"></i>sin fecha</span>
        <span style="opacity:.7">rueda o pellizco para acercarte · toca a alguien para seguirle</span>
      </span>
    </div>
  </div>
</div>

var puerta = document.getElementById('puerta');
var inp = document.getElementById('clave');
var btn = document.getElementById('entrar');
var msg = document.getElementById('fallo');

function b2a(b) { return Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); }); }

async function abrir() {
  var clave = (inp.value || '').toUpperCase().trim();
  if (!clave) { msg.textContent = 'Escribe la clave.'; return; }
  btn.disabled = true; msg.textContent = 'Abriendo…';
  try {
    var raw = b2a(D);
    var salt = raw.slice(0, 16), iv = raw.slice(16, 28);
    /* el paquete guarda salt+iv+tag+cifrado; WebCrypto espera el tag al final */
    var tag = raw.slice(28, 44), cif = raw.slice(44);
    var datos = new Uint8Array(cif.length + tag.length);
    datos.set(cif, 0); datos.set(tag, cif.length);
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave),
      'PBKDF2', false, ['deriveKey']);
    var k = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: salt, iterations: 300000, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var txt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, k, datos);
    var codigo = new TextDecoder().decode(txt);
    puerta.classList.add('ido');
    document.getElementById('todo').classList.add('va');
    setTimeout(function () {
      var s = document.createElement('script');
      s.textContent = codigo;
      document.body.appendChild(s);
      puerta.remove();
    }, 260);
  } catch (e) {
    btn.disabled = false;
    msg.textContent = 'Esa clave no abre este mapa.';
    inp.select();
  }
}
btn.addEventListener('click', abrir);
inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') abrir(); });
inp.focus();
