<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivo familiar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--mesa:#151E19;--mesa2:#1D2A23;--linea:#31423A;--papel:#EDE7D8;--papel-col:#D9D4C6;
 --tinta:#241F18;--tinta-suave:#5C554A;--violeta:#6B4E9E;--ocre:#B8862B;--oxido:#8C3A2E;
 --verde-claro:#8FB09C;--azul:#4A7C94}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html{background-color:#151E19}
body{background-color:#151E19;color:#EDE7D8;font-family:'Karla',system-ui,sans-serif;
 font-size:16px;line-height:1.5;padding-bottom:64px;min-height:100vh;
 background-image:radial-gradient(ellipse at 50% 0%,rgba(143,176,156,.07),transparent 60%)}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:40;background:rgba(21,30,25,.94);backdrop-filter:blur(8px);
 border-bottom:1px solid var(--linea)}
.hd{display:flex;align-items:baseline;gap:12px;padding:13px 0 9px;flex-wrap:wrap}
h1{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(19px,4.2vw,26px);
 letter-spacing:-.02em;line-height:1}
.sub{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--verde-claro);
 letter-spacing:.09em;text-transform:uppercase}
.buscador{position:relative;padding-bottom:11px}
input[type=search]{width:100%;padding:10px 12px;border-radius:3px;border:1px solid var(--linea);
 background:var(--mesa2);color:var(--papel);font-family:'Karla',sans-serif;font-size:15px}
input[type=search]:focus{outline:2px solid var(--verde-claro);outline-offset:1px}
input[type=search]::placeholder{color:#6E8378}
.resultados{position:absolute;left:0;right:0;top:100%;z-index:50;background:var(--mesa2);
 border:1px solid var(--linea);border-radius:3px;max-height:56vh;overflow:auto;display:none}
.resultados.on{display:block}
.resultados button{display:block;width:100%;text-align:left;padding:9px 12px;background:none;border:0;
 border-bottom:1px solid var(--linea);color:var(--papel);font-family:'Karla',sans-serif;font-size:15px;cursor:pointer}
.resultados button:hover,.resultados button:focus{background:#26362D;outline:none}
.resultados .g{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--verde-claro)}
nav.tabs{display:flex;border-bottom:1px solid var(--linea);overflow-x:auto}
nav.tabs button{flex:1 0 auto;padding:11px 12px;background:none;border:0;border-bottom:2px solid transparent;
 color:#8CA396;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;
 text-transform:uppercase;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--papel);border-bottom-color:var(--ocre)}
nav.tabs button:focus-visible{outline:2px solid var(--verde-claro);outline-offset:-2px}
.vista{padding:18px 0 32px;background-color:#151E19}
.rama-caja{position:relative}
.rama-caja h3{position:relative;padding-left:14px}
.rama-caja h3::before{content:'';position:absolute;left:0;top:.18em;bottom:.18em;width:4px;border-radius:2px;background:var(--linea2)}
.llamada{
  border:1px solid var(--ocre);border-radius:4px;padding:17px 18px;margin:20px 0 4px;
  background:linear-gradient(160deg,rgba(216,163,64,.10),rgba(216,163,64,.02));text-align:left;
}
.llamada h4{
  font-family:'Fraunces',serif;font-weight:600;font-size:19px;line-height:1.18;
  margin-bottom:8px;color:#E8BC63;letter-spacing:-.01em;
}
.llamada p{font-size:15px;color:#A8BDB1;margin-bottom:13px;max-width:56ch}
.llamada .pide{font-size:14px;color:#A8BDB1;margin-bottom:15px}
.llamada .pide span{display:inline-block;margin:0 10px 5px 0;padding-left:13px;position:relative}
.llamada .pide span::before{content:'·';position:absolute;left:3px;color:var(--ocre)}
.llamada a{
  display:inline-block;background:var(--ocre);color:#151E19;padding:11px 20px;border-radius:3px;
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;font-weight:600;text-decoration:none;
}
.llamada a:hover{background:#E8BC63}
.llamada.suave{border-color:#3C5148;background:linear-gradient(160deg,rgba(216,163,64,.05),transparent)}
.llamada.suave h4{color:#EDE7D8;font-size:17.5px}
.llamada.suave a{background:none;border:1px solid var(--ocre);color:var(--ocre)}
.llamada.suave a:hover{background:var(--ocre);color:#151E19}
.llamada.viva{border-color:#3C5148;background:none}
.llamada.viva h4{color:#A8BDB1;font-size:16px}
.llamada.viva a{background:none;border:1px solid #3C5148;color:#A8BDB1;font-size:10.5px}
.llamada.viva a:hover{border-color:var(--ocre);color:var(--ocre)}
.llamada .clave{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:#8CA396;
  margin-top:9px;letter-spacing:.05em;
}
main{background-color:#151E19}
.fila-tit{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
 color:#7F9689;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.fila-tit::after{content:"";flex:1;height:1px;background:var(--linea)}
.fila{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.tira{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:20px;scrollbar-width:thin}
.tira::-webkit-scrollbar{height:6px}
.tira::-webkit-scrollbar-thumb{background:var(--linea);border-radius:3px}
.ficha{background:var(--papel);color:var(--tinta);border-radius:2px;padding:10px 12px;text-align:left;
 cursor:pointer;border:0;border-left:3px solid var(--violeta);
 box-shadow:0 1px 0 rgba(0,0,0,.5),0 6px 14px -8px rgba(0,0,0,.8);font-family:'Karla',sans-serif;
 min-width:154px;flex:0 0 auto;max-width:238px;transition:transform .16s ease,box-shadow .16s ease}
.ficha:hover,.ficha:focus-visible{transform:translateY(-2px);
 box-shadow:0 2px 0 rgba(0,0,0,.5),0 12px 20px -10px rgba(0,0,0,.9);outline:none}
.ficha:focus-visible{outline:2px solid var(--ocre);outline-offset:2px}
.ficha.col{background:var(--papel-col);border-left-color:#9A9384}
.ficha.pol{background:var(--papel-col);border-left-color:var(--verde-claro)}
.ficha.hueco{background:none;border:1px dashed var(--linea);border-left:1px dashed var(--linea);
 color:#8CA396;box-shadow:none}
.ficha.hueco:hover{transform:none;border-color:var(--ocre);color:var(--papel)}
.ficha.viva{border-left-color:var(--azul)}
.ficha .nom{font-family:'Fraunces',serif;font-weight:600;font-size:15px;line-height:1.15;letter-spacing:-.01em}
.ficha.hueco .nom{font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:12.5px;letter-spacing:.02em}
.ficha .dat{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--tinta-suave);margin-top:3px}
.ficha.hueco .dat{color:#6E8378}
.ficha .gen{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--violeta);margin-bottom:3px}
.ficha.col .gen,.ficha.pol .gen{color:#7A7365}
.ficha.hueco .gen{color:#6E8378}
.centro{background:var(--papel);color:var(--tinta);border-radius:2px;padding:20px 18px 18px;position:relative;
 overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.5),0 18px 34px -16px rgba(0,0,0,.95);
 border-left:5px solid var(--violeta);margin-bottom:20px}
.centro.col,.centro.pol{border-left-color:#9A9384}
.centro.hueco{background:var(--mesa2);color:var(--papel);border:1px dashed var(--linea);
 border-left:5px dashed var(--ocre);box-shadow:none}
.centro.viva{border-left-color:var(--azul)}
.centro h2{font-family:'Fraunces',serif;font-weight:900;font-size:clamp(21px,4.8vw,30px);line-height:1.05;
 letter-spacing:-.025em;max-width:76%}
.centro.hueco h2{font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:clamp(16px,3.6vw,21px);
 letter-spacing:0;color:var(--ocre)}
.centro .vida{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--tinta-suave);margin-top:6px}
.centro.hueco .vida{color:#8CA396}
.centro .lin{display:inline-block;margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:10px;
 letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border:1px solid currentColor;border-radius:2px;
 color:var(--violeta);margin-right:6px}
.centro.col .lin,.centro.pol .lin{color:#7A7365}
.centro.hueco .lin{color:#8CA396}
.sello{position:absolute;top:14px;right:-6px;transform:rotate(-7deg);border:2.5px solid var(--violeta);
 color:var(--violeta);padding:5px 9px 4px;border-radius:3px;font-family:'IBM Plex Mono',monospace;
 font-weight:500;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.82;max-width:124px;
 text-align:center;line-height:1.25}
.sello.s-hip{border-color:var(--oxido);color:var(--oxido)}
.sello.s-falta{border-color:#8B8375;color:#8B8375;border-style:dashed}
.sello.s-doc{border-color:#2F6B4A;color:#2F6B4A}
.sello.s-viva{border-color:var(--azul);color:var(--azul)}
.hechos{margin-top:18px;border-top:1px solid #CFC8B6;padding-top:12px}
.centro.hueco .hechos{border-top-color:var(--linea)}
.hecho{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dotted #D3CCBA}
.centro.hueco .hecho{border-bottom-color:var(--linea)}
.hecho:last-child{border-bottom:0}
.hecho .txt{flex:1;font-size:14.5px;line-height:1.4}
.hecho .txt small{display:block;color:var(--tinta-suave);font-size:12.5px;margin-top:2px}
.centro.hueco .hecho .txt small{color:#8CA396}
.marca{flex:0 0 auto;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.1em;
 text-transform:uppercase;padding:2px 5px;border-radius:2px;border:1px solid;white-space:nowrap;margin-top:2px}
.m-doc{color:#2F6B4A;border-color:#2F6B4A}
.m-mem{color:var(--violeta);border-color:var(--violeta)}
.crono .m-mem{color:#A98FD8;border-color:#A98FD8}
.crono .m-doc{color:#6FC095;border-color:#6FC095}
.crono .m-hip{color:#D8776A;border-color:#D8776A}
.crono .m-falta{color:#A8BDB1;border-color:#A8BDB1}
.m-hip{color:var(--oxido);border-color:var(--oxido)}
.m-falta{color:#8B8375;border-color:#8B8375;border-style:dashed}
.m-out{color:#8B8375;border-color:#8B8375;text-decoration:line-through}
.m-viva{color:var(--azul);border-color:var(--azul)}
.centro.hueco .m-doc{color:#6FAF88;border-color:#6FAF88}
.centro.hueco .m-falta{color:#8CA396;border-color:#8CA396}
.volver{background:none;border:1px solid var(--linea);color:#8CA396;border-radius:3px;padding:5px 10px;
 font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
 cursor:pointer;margin-bottom:14px}
.volver:hover{color:var(--papel);border-color:var(--verde-claro)}
.marcador{border:1px solid var(--linea);border-radius:3px;background:var(--mesa2);padding:16px;margin-bottom:22px}
.marcador h3{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin-bottom:3px}
.marcador .pie{font-size:13.5px;color:#8CA396;margin-bottom:14px}
.gen-fila{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--linea)}
.gen-fila .et{flex:0 0 138px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;
 text-transform:uppercase;color:#8CA396}
.barra{flex:1;height:9px;background:#243128;border-radius:2px;overflow:hidden}
.barra i{display:block;height:100%;background:var(--ocre)}
.gen-fila .num{flex:0 0 58px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--papel)}
@media(max-width:520px){.gen-fila .et{flex-basis:98px;font-size:10px}}
.rama-caja{border:1px solid var(--linea);border-radius:3px;background:var(--mesa2);padding:16px;margin-bottom:14px}
.rama-caja h3{font-family:'Fraunces',serif;font-weight:600;font-size:20px}
.rama-caja .ap{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
 color:var(--verde-claro);margin-top:2px}
.rama-caja p{font-size:14px;color:#B9C7BF;margin:9px 0 11px}
.rama-caja .fila{margin-bottom:0}
.hueco-grupo{margin-bottom:24px}
.hueco-grupo h3{font-family:'Fraunces',serif;font-weight:600;font-size:19px;margin-bottom:2px}
.hueco-grupo .n{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--verde-claro);
 letter-spacing:.09em;text-transform:uppercase;margin-bottom:10px}
.preg{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--linea);align-items:flex-start}
.preg .idx{flex:0 0 34px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ocre)}
.preg .cu{flex:1;font-size:15px}
.preg .cu small{display:block;color:#8CA396;font-size:13px;margin-top:2px}
.preg button{background:none;border:0;color:var(--papel);text-decoration:underline;text-underline-offset:2px;
 cursor:pointer;font:inherit;padding:0;text-align:left}
.preg button:hover{color:var(--ocre)}
.crono{border-left:2px solid var(--linea);margin-left:8px;padding-left:18px;
 background-color:#151E19;color:#EDE7D8}
.ev{position:relative;padding:10px 0;color:#EDE7D8}
.ev::before{content:"";position:absolute;left:-25px;top:16px;width:9px;height:9px;border-radius:50%;
 background:var(--mesa);border:2px solid var(--verde-claro)}
.ev.hito::before{background:var(--oxido);border-color:var(--oxido);width:11px;height:11px;left:-26px}
.ev.fin::before{background:var(--mesa2);border-color:#6E8378}
.ev .f{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#D8A340;letter-spacing:.06em;font-weight:500}
.ev .t{font-size:15.5px;margin-top:2px;color:#EDE7D8;font-weight:500}
.ev.hito .t{font-family:'Fraunces',serif;font-weight:700;font-size:18px;color:#F4EFE2}
.ev .l{font-size:13px;color:#A8BDB1;margin-top:2px}
.ev .marca{display:inline-block;margin-top:6px}
.lugar{border:1px solid var(--linea);border-radius:3px;padding:14px;margin-bottom:12px;background:var(--mesa2)}
.lugar h3{font-family:'Fraunces',serif;font-weight:600;font-size:19px}
.lugar .prov{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--verde-claro);
 letter-spacing:.09em;text-transform:uppercase}
.lugar p{font-size:14px;color:#B9C7BF;margin:8px 0 10px}
.lugar li{list-style:none;font-size:14.5px;padding:5px 0;border-top:1px dotted var(--linea);display:flex;
 gap:10px;align-items:flex-start}
.lugar button.pers{color:var(--papel);text-decoration:underline;text-underline-offset:2px;cursor:pointer;
 background:none;border:0;padding:0;font:inherit;text-align:left}
.lugar button.pers:hover{color:var(--ocre)}
.leyenda{border-top:1px solid var(--linea);margin-top:26px;padding-top:16px;display:flex;flex-wrap:wrap;
 gap:8px 16px;font-size:12.5px;color:#8CA396}
.leyenda span{display:flex;align-items:center;gap:6px}
.aviso{border-left:3px solid var(--azul);background:var(--mesa2);padding:12px 14px;border-radius:0 3px 3px 0;
 font-size:14px;color:#B9C7BF;margin-bottom:20px}
@media(max-width:560px){.ficha{min-width:136px;max-width:198px}.centro h2{max-width:100%}
 .sello{position:static;transform:none;display:inline-block;margin-top:12px;max-width:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* Dónde estuvo · va dentro de la ficha central, que es de fondo claro */
.donde{margin-top:20px;padding-top:16px;border-top:1px solid rgba(36,31,24,.14);text-align:left}
.donde-tit{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.19em;
  text-transform:uppercase;color:#6B4E9E;margin-bottom:12px}
.paso{display:flex;gap:11px;align-items:baseline;padding:6px 0}
.paso-an{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5C554A;min-width:4.5ch;
  font-variant-numeric:tabular-nums}
.paso-txt{font-size:15.5px;line-height:1.4;color:#241F18}
.paso-txt b{font-weight:600;color:#6B4E9E}
.paso-txt a{color:#241F18;text-decoration:none;border-bottom:1px solid rgba(107,78,158,.45)}
.paso-txt a:hover{border-color:#6B4E9E;color:#6B4E9E}
.paso-txt small{display:block;font-size:11px;color:#5C554A;margin-top:1px}
.dir-f{margin:4px 0 10px 5.5ch;padding-left:12px;border-left:2px solid rgba(107,78,158,.4)}
.dir-f b{display:block;font-size:14px;font-weight:600;color:#241F18}
.dir-f span{display:block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;
  letter-spacing:.13em;color:#5C554A;text-transform:uppercase;margin:1px 0 4px}
.dir-f a{font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:#6B4E9E;text-decoration:none;border-bottom:1px solid currentColor}
.dir-f a:hover{color:#241F18}
.ver-recorrido{display:block;margin-top:16px;padding:12px;text-align:center;
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;background:#6B4E9E;color:#EDE7D8;text-decoration:none;border-radius:3px}
.ver-recorrido:hover{background:#553D80}
.ver-recorrido.suave{background:transparent;color:#6B4E9E;border:1px solid rgba(107,78,158,.45)}
.ver-recorrido.suave:hover{background:rgba(107,78,158,.09)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="puerta">
  <div class="pu-caja">
    <div class="pu-eyebrow">Archivo familiar</div>
    <h1>Para entrar hace falta<br>la <em>clave familiar</em></h1>
    <p class="pu-txt">Este archivo guarda datos de personas vivas, así que va cerrado.
    Si no tienes la clave, pídesela a quien te haya pasado el enlace.</p>
    <input id="pu-clave" type="text" placeholder="Clave familiar" autocapitalize="characters"
           autocomplete="off" spellcheck="false" aria-label="Clave familiar">
    <button id="pu-entrar">Entrar</button>
    <div id="pu-msg" role="status" aria-live="polite"></div>
  </div>
</div>
<style>
#puerta{position:fixed;inset:0;z-index:200;background:#151E19;display:flex;align-items:center;
  justify-content:center;padding:26px;overflow-y:auto}
#puerta.off{display:none}
.pu-caja{width:100%;max-width:430px}
.pu-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;color:#D8A340;margin-bottom:14px}
#puerta h1{font-family:'Fraunces',Georgia,serif;font-weight:900;font-size:clamp(27px,7.5vw,40px);
  line-height:1.03;letter-spacing:-.03em;margin-bottom:15px;color:#EDE7D8}
#puerta h1 em{font-style:normal;color:#D8A340}
.pu-txt{font-size:16px;color:#A8BDB1;margin-bottom:24px;line-height:1.5}
#pu-clave{width:100%;background:#1B2621;border:1px solid #3C5148;border-radius:3px;padding:15px 16px;
  color:#EDE7D8;font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.09em;text-align:center}
#pu-clave:focus{outline:none;border-color:#D8A340}
#pu-entrar{width:100%;margin-top:10px;background:#D8A340;color:#151E19;border:none;border-radius:3px;
  padding:15px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.11em;
  text-transform:uppercase;font-weight:600;cursor:pointer}
#pu-entrar:hover{background:#F0C46A}
#pu-entrar:disabled{opacity:.5;cursor:default}
#pu-msg{margin-top:14px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#D8776A;min-height:18px;text-align:center}
#pu-msg.ok{color:#6FC095}
</style>

  var caja=document.getElementById('puerta'), inp=document.getElementById('pu-clave');
